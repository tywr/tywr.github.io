<header class="site-header">
  <div class="flex flex-wrap items-center justify-between px-4 py-2 shadow">
    <a
      class="font-mono font-bold text-2xl tracking-wide text-accent"
      href="{{ .Site.BaseURL }}"
      >{{ .Site.Title }}</a
    >
    <div class="header-right">
      <nav
        class="site-nav hidden items-center gap-4 px-4 py-2 md:flex"
        aria-label="Main navigation"
      >
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="text-fg hover:text-fg-bright"
          >{{ .Name }}</a
        >
        {{ end }}
      </nav>

      <details class="relative md:hidden">
        <summary
          class="cursor-pointer list-none rounded-md px-3 py-2 text-fg hover:bg-toggle-bg"
          aria-label="Open navigation"
        >
          Menu
        </summary>
        <nav
          class="absolute right-0 mt-2 flex min-w-40 flex-col rounded-lg border border-border bg-bg p-2 shadow-lg"
          aria-label="Mobile navigation"
        >
          {{ range .Site.Menus.main }}
          <a
            href="{{ .URL }}"
            class="rounded-md px-4 py-2 text-fg hover:bg-toggle-bg hover:text-fg-bright"
          >
            {{ .Name }}
          </a>
          {{ end }}
        </nav>
      </details>
    </div>
  </div>
</header>
